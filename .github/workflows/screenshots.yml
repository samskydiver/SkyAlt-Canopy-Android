name: Emulator screenshots

on:
  workflow_dispatch:
  push:
    branches: ["feature/**"]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front emulated
          disable-animations: true
          script: bash scripts/emulator-screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
      - name: Push the screenshots to the ci-screenshots branch
        if: always()
        run: |
          cat screenshots/logcat.txt || true
          cd screenshots
          rm -f logcat-full.txt
          git init -q
          git checkout -q -b ci-screenshots
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "Screenshots of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
